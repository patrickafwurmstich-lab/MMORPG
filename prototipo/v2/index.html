<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Andar 1 Protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="textos"></div>
<div id="hud">
  <div class="barra b-vida"><i id="hVida"></i><span id="tVida">Vida</span></div>
  <div class="barra b-res"><i id="hRes"></i><span id="tRes">Resistência</span></div>
  <div class="barra b-ene"><i id="hEne"></i><span id="tEne">Energia</span></div>
  <div class="barra b-pos"><i id="hPos"></i><em id="hDiv"></em><span id="tPos">Postura</span></div>
  <div class="barra b-imp"><i id="hImp"></i><span id="tImp">Ímpeto 0</span></div>
  <div class="barra b-xp"><i id="hXp"></i></div>
  <div id="info"></div>
</div>
<div id="alvo"><div class="nome" id="aNome"></div><div class="barra b-vida"><i id="aVida"></i></div><div class="barra b-pos" style="height:6px;margin-top:2px"><i id="aPos"></i></div><div class="contatos" id="aCont"></div></div>
<div id="chefe"><div class="nome">Guardião do Andar 1</div><div class="barra b-vida"><i id="cVida"></i></div><div class="barra b-pos" style="height:7px;margin-top:2px"><i id="cPos"></i></div></div>
<div id="topo-dir">
  <button class="btn-peq" id="bLer">Ler</button>
  <button class="btn-peq" id="bCarga">Carga 0</button>
  <button class="btn-peq" id="bMod">Normal</button>
  <button class="btn-peq" id="bMec">Mecânica</button>
  <button class="btn-peq" id="bAlvo">Alvo</button>
  <button class="btn-peq" id="bMenu">Menu</button>
</div>
<div id="joy"></div>
<div id="joyBase"><div id="joyPonta"></div></div>
<div id="dica-joy">arraste aqui para andar</div>
<div id="botoes">
  <button class="bt" id="bT1"><i class="cd"></i><span class="lb"></span></button>
  <button class="bt" id="bT2"><i class="cd"></i><span class="lb"></span></button>
  <button class="bt" id="bT3"><i class="cd"></i><span class="lb"></span></button>
  <button class="bt" id="bT4"><i class="cd"></i><span class="lb"></span></button>
  <button class="bt" id="bPag"><span class="lb">Pág 1</span></button>
  <button class="bt" id="bReac"><i class="cd"></i><span class="lb">Reação</span></button>
  <button class="bt" id="bCura"><i class="cd"></i><span class="lb">Cura</span></button>
  <button class="bt" id="bImp"><span class="lb">Golpe<br>Ímpeto</span></button>
  <button class="bt" id="bDef"><span class="lb">Defesa</span></button>
  <button class="bt" id="bEsq"><span class="lb">Esquiva</span></button>
  <button class="bt" id="bAtk"><span class="lb">Ataque<br><small>segure = pesado</small></span></button>
</div>
<div id="aviso"></div>
<div id="painel" role="dialog" aria-label="Menu do personagem">
  <div id="abas"></div>
  <div id="conteudo"></div>
</div>
<div id="tela"><div class="caixa" id="telaCaixa"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="dados.js"></script>
<script src="jogo.js"></script>
</body>
</html>
